[project]
name = "fua-morphometrics"
version = "0.1.0"
description = "Open-source Python 3 replication and extension of Sapena, Ruiz & Taubenböck (2020) spatio-temporal urban morphometrics for Functional Urban Areas."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Emanuel Jose Agu" },
]
dependencies = [
    "geopandas>=0.14",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
